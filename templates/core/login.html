<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | SkillBridge</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        /* Left Visual Card */
        .auth-left {
            flex: 1.05;
            padding: 24px;
            display: flex;
            position: relative;
        }

        .auth-card-banner {
            width: 100%;
            height: 100%;
            min-height: 620px;
            border-radius: 28px;
            background: #ffffff url('/static/img/signin_card.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .brand-badge {
            background: #000000;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.3px;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
        }

        .brand-badge i {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .hero-bottom-glass {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 18px 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
            max-width: 380px;
        }

        .hero-glass-text {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }

        /* Right Auth Panel */
        .auth-right {
            flex: 0.95;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
            background: #000000;
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 390px;
        }

        .auth-heading {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            color: #ffffff;
        }

        /* SSO Social Buttons */
        .btn-social {
            width: 100%;
            height: 48px;
            background: #141416;
            border: 1px solid #222226;
            color: #ffffff;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-social:hover {
            background: #1c1c1f;
            border-color: #2f2f35;
            color: #ffffff;
        }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #52525b;
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #27272a;
        }

        .auth-divider span {
            padding: 0 14px;
        }

        /* Inputs */
        .auth-input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .auth-input {
            width: 100%;
            height: 50px;
            background: #141416;
            border: 1px solid #222226;
            border-radius: 12px;
            padding: 0 18px;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .auth-input::placeholder {
            color: #52525b;
        }

        .auth-input:focus {
            border-color: #4f46e5;
            background: #18181b;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
        }

        .auth-input-group .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            padding: 0;
        }

        .auth-input-group .toggle-password:hover {
            color: #ffffff;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            height: 50px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.96rem;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #f4f4f5;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer Links */
        .auth-links {
            text-align: center;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.88rem;
            transition: color 0.2s ease;
        }

        .auth-links a:hover {
            color: #ffffff;
        }

        .auth-links .signup-link strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* Demo Quick Pill Bar (For Evaluators & Presentations) */
        .demo-bar {
            margin-top: 28px;
            padding: 14px 16px;
            background: #121214;
            border: 1px dashed #27272a;
            border-radius: 14px;
        }

        .demo-bar-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #71717a;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .demo-pill {
            background: #1c1c20;
            color: #d4d4d8;
            border: 1px solid #27272a;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-pill:hover {
            background: #27272a;
            color: #ffffff;
            border-color: #4f46e5;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .auth-container {
                flex-direction: column;
            }
            .auth-left {
                display: none;
            }
            .auth-right {
                flex: 1;
                min-height: 100vh;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Left Side: Architectural Wave Card from Design -->
        <div class="auth-left">
            <div class="auth-card-banner">
                <!-- Top Brand Badge -->
                <a href="{% url 'index' %}" class="brand-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4V14zm10 0h6v6h-6V14z"/>
                    </svg>
                    <span>SkillBridge</span>
                </a>

                <!-- Bottom Text Banner -->
                <div>
                    <div class="hero-bottom-glass">
                        <div class="d-inline-flex align-items-center gap-2 mb-2">
                            <span class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle text-uppercase px-2 py-1" style="font-size: 0.65rem; font-weight: 700;">Enterprise Portal</span>
                            <span class="text-white-50 small fw-semibold" style="font-size: 0.75rem;">Verified Platform</span>
                        </div>
                        <div class="hero-glass-text">
                            Skill-verified campus placements and automated corporate recruitment.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Dark Authentication Form -->
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <h1 class="auth-heading">Sign in</h1>

                <!-- Apple Sign In Button -->
                <button type="button" class="btn-social" onclick="alert('Apple Sign In is available in production enterprise deployment.')">
                    <i class="fa-brands fa-apple fs-5"></i>
                    <span>Sign in with Apple</span>
                </button>

                <!-- Google Sign In Button -->
                <button type="button" class="btn-social" onclick="alert('Google Workspace OAuth is available in production enterprise deployment.')">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <!-- Or Divider -->
                <div class="auth-divider">
                    <span>or</span>
                </div>

                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 px-3 small rounded-3 mb-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Standard Form -->
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="auth-input-group">
                        <input type="text" name="username" id="id_username" class="auth-input" placeholder="Email or Username" required autofocus>
                    </div>

                    <div class="auth-input-group">
                        <input type="password" name="password" id="id_password" class="auth-input" placeholder="Password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fa-regular fa-eye-slash" id="toggleIcon"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-submit">
                        Sign in
                    </button>
                </form>

                <!-- Footer Links -->
                <div class="auth-links">
                    <a href="#" onclick="alert('Password reset link has been dispatched to your registered institutional email.'); return false;">
                        Forgot password?
                    </a>
                    <div class="signup-link">
                        <span style="color: #71717a;">No account?</span> 
                        <a href="{% url 'register' %}"><strong>Sign up</strong></a>
                    </div>
                </div>

                <!-- Evaluator Demo Quick-Fill Bar -->
                <div class="demo-bar">
                    <div class="demo-bar-title">
                        <i class="fa-solid fa-bolt text-warning"></i>
                        <span>1-Click Demo Accounts</span>
                    </div>
                    <div class="demo-pills">
                        <button type="button" class="demo-pill" onclick="quickFillRole('student')">Student (Rahul)</button>
                        <button type="button" class="demo-pill" onclick="quickFillRole('tpo')">TPO (RVCE)</button>
                        <button type="button" class="demo-pill" onclick="quickFillRole('recruiter')">Google (Recruiter)</button>
                        <button type="button" class="demo-pill" onclick="quickFillRole('admin')">Admin</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toggle Password Visibility & Quick Fill Script -->
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('id_password');
            const icon = document.getElementById('toggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function quickFillRole(role) {
            const creds = {
                'student': { u: 'student_rahul', p: atob('cmFodWwxMjM=') },
                'tpo': { u: 'tpo_rvce', p: atob('dHBvMTIz') },
                'recruiter': { u: 'recruiter_google', p: atob('dGVjaDEyMw==') },
                'admin': { u: 'admin', p: atob('YWRtaW4xMjM=') }
            };
            if (creds[role]) {
                document.getElementById('id_username').value = creds[role].u;
                document.getElementById('id_password').value = creds[role].p;
            }
        }
    </script>
</body>
</html>
